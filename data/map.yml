title: "World of Adaptive Decision Intelligence"

types:
  foundation: { label: Foundation, color: "#b5893b" }
  core: { label: Core, color: "#2f5f7a" }
  frontier: { label: Frontier, color: "#5f4a85" }
  application: { label: Application, color: "#4f7a4a" }

continents:
  - id: pretraining
    name: "RL Pre-Training"
    color: "#6f8a4a"
    cx: 420
    cy: 235
    rx: 300
    ry: 180
    seed: 11
    desc: "Learning reusable decision-making priors from offline, reward-free, or large-scale data before the downstream task is known."

  - id: adaptation
    name: "Test-Time Adaptation"
    color: "#b8683c"
    cx: 1280
    cy: 240
    rx: 305
    ry: 188
    seed: 23
    desc: "Adapting agents and models at deployment time: inferring rewards, planning at decision time, and aligning without retraining."

  - id: transfer
    name: "Transfer & Generalization"
    label: "Transfer"
    color: "#7d6596"
    cx: 410
    cy: 668
    rx: 305
    ry: 172
    seed: 37
    desc: "Carrying knowledge across domains, embodiments, tasks, and objectives."

  - id: optimization
    name: "Bandits & Optimization Theory"
    label: "Bandits & Optimization"
    color: "#b2902f"
    cx: 1280
    cy: 660
    rx: 315
    ry: 178
    seed: 5
    desc: "The theoretical backbone of the lab: bandit learning, Bayesian optimization, and provably convergent policy optimization."

  - id: constrained-isle
    name: "Constrained RL"
    color: "#4f7a5e"
    cx: 850
    cy: 760
    rx: 88
    ry: 60
    seed: 3
    island: true
    desc: "Reinforcement learning under hard action and safety constraints."

  - id: archipelagos
    name: "Skills, Benchmarks & Applications"
    color: "#9c8461"
    archipelago: true
    desc: "Small islands where the lab's methods meet skills, benchmarks, and real-world problems."

