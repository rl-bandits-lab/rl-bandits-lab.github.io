  bio:
    - "Dr. Ping-Chun Hsieh is an Associate Professor in the <a href=\"https://www.cs.nycu.edu.tw\">Department of Computer Science</a> at <a href=\"https://www.nycu.edu.tw/en\">National Yang Ming Chiao Tung University (NYCU)</a>. Before joining NYCU, he was a Postdoctoral Researcher hosted by Professor <a href=\"https://cesg.tamu.edu/faculty/p-r-kumar/\">P. R. Kumar</a> in the <a href=\"https://cesg.tamu.edu/\">Computer Engineering and Systems Group (CESG)</a> at Texas A&amp;M University. He received his Ph.D. in Electrical and Computer Engineering from Texas A&amp;M University in August 2018 under the supervision of Professor <a href=\"https://cesg.tamu.edu/faculty/ihong-hou/\">I-Hong Hou</a>, and his B.S. in Electrical Engineering and M.S. in Electronics Engineering from National Taiwan University in 2011 and 2013."
    - "His research received the Best Paper Awards from <a href=\"https://www.sigmobile.org/mobihoc/2020/awards.html\">ACM MobiHoc 2020</a> and <a href=\"https://cesg.tamu.edu/2017/12/11/best-paper-award-from-acm-mobihoc-2017/\">ACM MobiHoc 2017</a>. His research interests include reinforcement learning, multi-armed bandits, Bayesian optimization, and wireless networks."
