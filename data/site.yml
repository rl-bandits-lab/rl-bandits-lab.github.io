lab:
  name: "Reinforcement Learning and Bandits Lab"
  short: "RL & Bandits Lab"
  affiliation: "Department of Computer Science, National Yang Ming Chiao Tung University"
  affiliationShort: "NYCU CS"
  location: "Lab: EC 129, Engineering Building III, Guangfu Campus (光復校區工程三館 129 室)"
  github: "https://github.com/rl-bandits-lab"
  intro: "We study how agents learn to make good decisions under uncertainty — from the theory of bandits and policy optimization to reinforcement learning methods that pretrain, adapt, and transfer across domains. Our work spans provable algorithms and practical systems, with applications ranging from large language models to robotics and games."
  openings:
    - "(115年度碩博錄取生歡迎來信詢問) We are looking for highly motivated postdoctoral researchers, graduate students, undergraduate students, and research assistants interested in theoretical or system aspects of reinforcement learning, bandit learning, Bayesian optimization, and related areas. NYCU students are welcome to discuss research with Prof. Hsieh."
    - "<b>Openings:</b> 1 postdoctoral position and multiple PhD positions in (1) reinforcement learning, (2) bandit learning, and (3) optimization. Please email Prof. Hsieh your CV and research interests."

